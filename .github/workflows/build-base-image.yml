name: Build Base Builder Image

on:
  workflow_dispatch:
    inputs:
      esp_idf_ref:
        description: "ESP-IDF ref/tag for prebaked baseline (blank: ESP_IDF_REF in Dockerfile.ghcr)"
        required: false
        default: ""
  push:
    branches: [ main ]
    paths:
      - Dockerfile.ghcr
      - .github/workflows/build-base-image.yml

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set image metadata
        id: meta
        run: |
          OWNER_LC="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${OWNER_LC}/2048-esp32-base"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        env:
          # Passed through env, not interpolated into the script, so the input is data.
          ESP_IDF_REF_INPUT: ${{ inputs.esp_idf_ref }}
        run: |
          # Dockerfile.ghcr's ESP_IDF_REF is the single source of the default baseline.
          IDF_REF="${ESP_IDF_REF_INPUT:-}"
          if [ -z "$IDF_REF" ]; then
            IDF_REF="$(sed -n 's/^ARG ESP_IDF_REF=//p' Dockerfile.ghcr)"
          fi
          test -n "$IDF_REF"
          docker build -f Dockerfile.ghcr \
            --build-arg ESP_IDF_REF="$IDF_REF" \
            -t "${{ steps.meta.outputs.image }}:latest" \
            -t "${{ steps.meta.outputs.image }}:idf-${IDF_REF}" \
            .
          docker push "${{ steps.meta.outputs.image }}:latest"
          docker push "${{ steps.meta.outputs.image }}:idf-${IDF_REF}"
