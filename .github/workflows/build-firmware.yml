name: Build 2048 Firmware

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  resolve-image-owner:
    runs-on: ubuntu-24.04
    outputs:
      owner_lc: ${{ steps.owner.outputs.owner_lc }}
    steps:
      - name: Lowercase GHCR owner
        id: owner
        run: echo "owner_lc=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve-image-owner
    runs-on: ubuntu-24.04
    # ESP32-P4 builds target chip revision v3.x, the silicon P4 boards now ship with.
    # Older v0.x/v1.x chips cannot run that image, so the Waveshare 4.3" also gets a
    # PRE_REV3 build for boards bought before the switch. fail-fast: false so one
    # board's failure doesn't cancel the others' builds.
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: waveshare_s3_lcd35b
          - board: waveshare_s3_lcd35
          - board: waveshare_s3_lcd2
          - board: waveshare_p4_lcd43
          - board: waveshare_p4_lcd43
            variant: PRE_REV3
          - board: waveshare_p4_lcd35
    defaults:
      run:
        shell: bash
    env:
      IDF_PATH: /opt/toolchains/esp-idf
      IDF_TOOLS_PATH: /opt/espressif
      BOARD: ${{ matrix.board }}
      BOARD_VARIANT: ${{ matrix.variant }}
      # Artifact and cache name: <BOARD>, or <BOARD>-<VARIANT> for a variant build.
      BUILD_NAME: ${{ matrix.variant && format('{0}-{1}', matrix.board, matrix.variant) || matrix.board }}
    container:
      # The ESP-IDF version tag (ESP_IDF_REF in Dockerfile.ghcr), not :latest, so an older
      # commit keeps building with the ESP-IDF release it was written for. Rebuilding the
      # image republishes the same tag: the ESP-IDF release and its compiler versions stay
      # the same, but Ubuntu and Python packages are installed fresh.
      image: ghcr.io/${{ needs.resolve-image-owner.outputs.owner_lc }}/2048-esp32-base:idf-v5.5.5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # esp-board-common is a submodule. Its own nested submodules (the camera
          # pipeline) are not needed, since the game leaves out its board_camera
          # component.
          submodules: true

      - name: Ensure baked ESP-IDF tools environment
        run: |
          test -d /opt/toolchains/esp-idf
          mkdir -p "$IDF_TOOLS_PATH"
          source "$IDF_PATH/export.sh"
          idf.py --version

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          # Relative to the workspace; the build step points CCACHE_DIR at the same dir.
          path: .ccache
          key: ccache-${{ env.BUILD_NAME }}-${{ hashFiles('main/**', 'components/**', 'boards/**') }}
          restore-keys: |
            ccache-${{ env.BUILD_NAME }}-

      - name: Build firmware
        # The same script as the local Docker build: it regenerates sdkconfig for the
        # board (and variant) and fails unless an ESP32-P4 image targets the intended
        # chip revisions.
        run: |
          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"
          source "$IDF_PATH/export.sh"
          ./scripts/build_firmware.sh

      - name: Record build provenance
        run: |
          {
            echo "board=$BOARD"
            echo "variant=${BOARD_VARIANT:-}"
            echo "target=$(sed -n 's/^CONFIG_IDF_TARGET="\(.*\)"/\1/p' sdkconfig)"
            if [ -f build/chip_revisions.txt ]; then cat build/chip_revisions.txt; fi
            echo "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "git_ref=${{ github.ref }}"
            echo "git_sha=${{ github.sha }}"
            echo "idf_head=$(git -C "$IDF_PATH" rev-parse HEAD)"
            echo "idf_version=$(source "$IDF_PATH/export.sh" >/dev/null 2>&1; idf.py --version 2>/dev/null || true)"
            echo "cmake=$(cmake --version | head -n1)"
          } | tee build/provenance.txt

      - name: Collect firmware artifacts
        run: |
          mkdir -p out/bootloader out/partition_table
          cp build/game_2048.bin build/game_2048.elf build/flash_args build/provenance.txt out/
          cp build/bootloader/bootloader.bin out/bootloader/
          cp build/partition_table/partition-table.bin out/partition_table/
          cp build-log.txt out/
          if [ -f build/chip_revisions.txt ]; then cp build/chip_revisions.txt out/; fi

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-2048-${{ env.BUILD_NAME }}
          path: out/

  desktop-linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev cmake pkg-config

      - name: Install LVGL from source
        run: |
          git clone --depth 1 --branch release/v9.5 https://github.com/lvgl/lvgl.git /tmp/lvgl
          cd /tmp/lvgl
          # Remove ARM assembly files (not valid on x86)
          find src -name '*.S' -delete
          cp ${{ github.workspace }}/boards/desktop/lv_conf.h .
          mkdir build && cd build
          cmake .. -DCMAKE_INSTALL_PREFIX=/usr/local \
                   -DLV_BUILD_CONF_DIR=/tmp/lvgl \
                   -DBUILD_SHARED_LIBS=OFF \
                   -DCONFIG_LV_BUILD_DEMOS=OFF \
                   -DCONFIG_LV_BUILD_EXAMPLES=OFF
          make -j$(nproc)
          sudo make install
          sudo ldconfig

      - name: Build desktop simulator
        run: |
          cmake -S boards/desktop -B boards/desktop/build
          cmake --build boards/desktop/build

      - name: Upload desktop binary
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: boards/desktop/build/game_2048_desktop

  desktop-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install sdl2

      - name: Install LVGL from source
        run: |
          git clone --depth 1 --branch release/v9.5 https://github.com/lvgl/lvgl.git /tmp/lvgl
          cd /tmp/lvgl
          find src -name '*.S' -delete
          cp ${{ github.workspace }}/boards/desktop/lv_conf.h .
          mkdir build && cd build
          cmake .. -DCMAKE_INSTALL_PREFIX=/usr/local \
                   -DLV_BUILD_CONF_DIR=/tmp/lvgl \
                   -DBUILD_SHARED_LIBS=OFF \
                   -DCONFIG_LV_BUILD_DEMOS=OFF \
                   -DCONFIG_LV_BUILD_EXAMPLES=OFF
          make -j$(sysctl -n hw.ncpu)
          sudo make install

      - name: Build desktop simulator
        run: |
          export PKG_CONFIG_PATH="/usr/local/share/pkgconfig:$PKG_CONFIG_PATH"
          cmake -S boards/desktop -B boards/desktop/build
          cmake --build boards/desktop/build

      - name: Upload desktop binary
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: boards/desktop/build/game_2048_desktop

  desktop-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SDL2
        shell: bash
        run: |
          curl -L -o sdl2.zip https://github.com/libsdl-org/SDL/releases/download/release-2.32.10/SDL2-devel-2.32.10-VC.zip
          unzip sdl2.zip -d /c/SDL2
          # VC package has include/SDL.h; restructure to include/SDL2/SDL.h
          # so #include <SDL2/SDL.h> works (matching Linux/macOS convention)
          cd /c/SDL2/SDL2-2.32.10
          mkdir -p include/SDL2
          mv include/*.h include/SDL2/
          echo "SDL2_DIR=C:/SDL2/SDL2-2.32.10/cmake" >> "$GITHUB_ENV"

      - name: Install LVGL from source
        shell: bash
        run: |
          git clone --depth 1 --branch release/v9.5 https://github.com/lvgl/lvgl.git /tmp/lvgl
          cd /tmp/lvgl
          find src -name '*.S' -delete
          cp "$GITHUB_WORKSPACE/boards/desktop/lv_conf.h" .
          mkdir build && cd build
          cmake .. -DCMAKE_INSTALL_PREFIX=C:/lvgl-install \
                   "-DLV_BUILD_CONF_DIR=$(cygpath -m /tmp/lvgl)" \
                   -DBUILD_SHARED_LIBS=OFF \
                   -DCONFIG_LV_BUILD_DEMOS=OFF \
                   -DCONFIG_LV_BUILD_EXAMPLES=OFF
          cmake --build . --config Release
          cmake --install . --config Release

      - name: Build desktop simulator
        shell: bash
        run: |
          cmake -S boards/desktop -B boards/desktop/build \
            -DCMAKE_PREFIX_PATH="C:/SDL2/SDL2-2.32.10;C:/lvgl-install"
          cmake --build boards/desktop/build --config Release

      - name: Collect Windows binary
        shell: bash
        run: |
          cp C:/SDL2/SDL2-2.32.10/lib/x64/SDL2.dll boards/desktop/build/Release/
          ls -la boards/desktop/build/Release/

      - name: Upload desktop binary
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: |
            boards/desktop/build/Release/game_2048_desktop.exe
            boards/desktop/build/Release/SDL2.dll
